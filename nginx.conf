# =============================================================================
# Nginx Configuration — Network Learn Atlas (Static Site)
# =============================================================================
# Place this file at:
#   /etc/nginx/sites-available/network-learn
# Then enable it:
#   sudo ln -s /etc/nginx/sites-available/network-learn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name example.com www.example.com;

    # -------------------------------------------------------------------------
    # Redirect all plain HTTP traffic to HTTPS
    # -------------------------------------------------------------------------
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name example.com www.example.com;

    # -------------------------------------------------------------------------
    # Document root — adjust to your deployment path
    # -------------------------------------------------------------------------
    root /var/www/network-learn;
    index index.html;

    # -------------------------------------------------------------------------
    # TLS / SSL certificates (e.g. from Let's Encrypt / Certbot)
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout    5s;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;
    add_header Content-Security-Policy
        "default-src 'self';
         script-src  'self';
         style-src   'self' https://fonts.googleapis.com 'unsafe-inline';
         font-src    'self' https://fonts.gstatic.com;
         img-src     'self' data:;
         connect-src 'self';
         frame-ancestors 'none';"
        always;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -------------------------------------------------------------------------
    # Static asset caching
    # -------------------------------------------------------------------------

    # HTML — short cache, always revalidated
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # CSS and JS — 1 year (fingerprint your files for cache-busting)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # Fonts and images — 1 year
    location ~* \.(woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # -------------------------------------------------------------------------
    # SPA / single-page fallback
    # Serve index.html for any path that does not match a real file
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Block access to hidden files (.git, .env, etc.)
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Block access to config / source files that must not be public
    # -------------------------------------------------------------------------
    location ~* \.(json|md|yml|yaml|lock|gitignore|nojekyll)$ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------------
    # Custom error pages (create these files if desired)
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/network-learn.access.log;
    error_log  /var/log/nginx/network-learn.error.log warn;
}
