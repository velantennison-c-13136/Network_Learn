# ═══════════════════════════════════════════════════════════
# conf/logging.properties — Tomcat's internal logging config
# Uses Java Util Logging (JUL) — NOT Log4j or SLF4J
# ═══════════════════════════════════════════════════════════

# ── Handlers (output destinations) ─────────────────────────
# Handlers define WHERE log messages go.
# Tomcat uses AsyncFileHandler to avoid blocking on I/O.

handlers = \
    1catalina.org.apache.juli.AsyncFileHandler, \
    2localhost.org.apache.juli.AsyncFileHandler, \
    3manager.org.apache.juli.AsyncFileHandler, \
    4host-manager.org.apache.juli.AsyncFileHandler, \
    java.util.logging.ConsoleHandler

# Which handlers the root logger uses (catches everything not caught above):
.handlers = 1catalina.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler

# ── Handler 1: catalina.YYYY-MM-DD.log ─────────────────────
# Main Tomcat engine log — startup, shutdown, connector events
1catalina.org.apache.juli.AsyncFileHandler.level     = FINE
1catalina.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
1catalina.org.apache.juli.AsyncFileHandler.prefix    = catalina.
1catalina.org.apache.juli.AsyncFileHandler.suffix    = .log
1catalina.org.apache.juli.AsyncFileHandler.maxDays   = 90  # keep 90 days of logs
1catalina.org.apache.juli.AsyncFileHandler.encoding  = UTF-8

# ── Handler 2: localhost.YYYY-MM-DD.log ─────────────────────
# Per-host log — app context startup, deployment errors
2localhost.org.apache.juli.AsyncFileHandler.level     = FINE
2localhost.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
2localhost.org.apache.juli.AsyncFileHandler.prefix    = localhost.
2localhost.org.apache.juli.AsyncFileHandler.suffix    = .log
2localhost.org.apache.juli.AsyncFileHandler.maxDays   = 90
2localhost.org.apache.juli.AsyncFileHandler.encoding  = UTF-8

# ── Handler 3: manager.YYYY-MM-DD.log ──────────────────────
# Tomcat Manager App activity (deploys, undeploys, reloads)
3manager.org.apache.juli.AsyncFileHandler.level     = FINE
3manager.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
3manager.org.apache.juli.AsyncFileHandler.prefix    = manager.
3manager.org.apache.juli.AsyncFileHandler.suffix    = .log
3manager.org.apache.juli.AsyncFileHandler.maxDays   = 90
3manager.org.apache.juli.AsyncFileHandler.encoding  = UTF-8

# ── Handler 4: host-manager.YYYY-MM-DD.log ─────────────────
4host-manager.org.apache.juli.AsyncFileHandler.level     = FINE
4host-manager.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
4host-manager.org.apache.juli.AsyncFileHandler.prefix    = host-manager.
4host-manager.org.apache.juli.AsyncFileHandler.suffix    = .log
4host-manager.org.apache.juli.AsyncFileHandler.maxDays   = 90
4host-manager.org.apache.juli.AsyncFileHandler.encoding  = UTF-8

# ── Console handler ─────────────────────────────────────────
# Outputs to stdout — ends up in catalina.out when run as a service
java.util.logging.ConsoleHandler.level     = FINE
java.util.logging.ConsoleHandler.formatter = org.apache.juli.OneLineFormatter
java.util.logging.ConsoleHandler.encoding  = UTF-8

# ── Logger levels — per Tomcat subsystem ────────────────────
# Available levels (most to least verbose):
#   ALL > FINEST > FINER > FINE > CONFIG > INFO > WARNING > SEVERE > OFF

# Catalina engine — set to INFO in production (FINE is very noisy)
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].level    = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].handlers = 2localhost.org.apache.juli.AsyncFileHandler

# Manager app logger
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/manager].level    = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/manager].handlers = 3manager.org.apache.juli.AsyncFileHandler

# Host Manager app logger
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/host-manager].level    = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/host-manager].handlers = 4host-manager.org.apache.juli.AsyncFileHandler

# Reduce noise from specific Tomcat subsystems in production:
org.apache.jasper.level                                  = WARNING  # JSP compiler — hide normal compile messages
org.apache.coyote.level                                  = WARNING  # HTTP connector — hide per-request details
org.apache.catalina.loader.WebappClassLoaderBase.level   = WARNING  # Hide class loading detail
org.apache.tomcat.util.net.level                         = WARNING  # NIO socket events

# ── Your application logging ────────────────────────────────
# If your app uses java.util.logging (JUL), you can control it here.
# For Log4j2 or SLF4J+Logback, configure those in your app's own
# log4j2.xml / logback.xml inside WEB-INF/classes — NOT here.

# Example: enable DEBUG for your own package:
# com.example.myapp.level = FINE

# ── Notes ───────────────────────────────────────────────────
# catalina.out   = System.out + System.err from ALL apps + Tomcat internals
#                  (this file grows forever unless you use logrotate or nohup redirect)
# catalina.log   = Tomcat internal log only (controlled by this file)
# localhost.log  = Context startup / app errors
#
# TIP: In production, set all levels to WARNING or SEVERE to reduce I/O.
# Use your app's own logging framework (Log4j2, Logback) for app logs.
# Rotate catalina.out with logrotate or set up a rolling appender.
